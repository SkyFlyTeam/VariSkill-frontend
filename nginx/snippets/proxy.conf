# Shared settings for locations proxied to Django.

# Keep the browser's Host so Django's ALLOWED_HOSTS and CSRF Origin checks
# see the same host the user typed.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Security headers come from security-headers.conf; drop Django's copies so
# responses don't carry conflicting duplicates.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# The chat endpoints wait on the external LLM.
proxy_read_timeout 120s;

proxy_intercept_errors off;
error_page 502 503 504 = @backend_unavailable;
error_page 429 = @too_many_requests;
