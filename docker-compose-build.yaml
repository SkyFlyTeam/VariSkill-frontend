name: vite-cookiecutter-build

# Requires the backend stack to be up first, since it creates the shared
# volume and network:
#   docker compose -f ../django-cookiecutter/docker-compose-build.yaml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: vite-cookiecutter:${IMAGE_TAG:-latest}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - cookiecutter-static:/usr/share/nginx/django-static:ro
    networks:
      - cookiecutter-shared
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  # Django collectstatic output, owned by django-cookiecutter/docker-compose-build.yaml.
  cookiecutter-static:
    name: cookiecutter-static
    external: true

networks:
  # Owned by django-cookiecutter/docker-compose-build.yaml; the API is reachable as "backend".
  cookiecutter-shared:
    name: cookiecutter-shared
    external: true
